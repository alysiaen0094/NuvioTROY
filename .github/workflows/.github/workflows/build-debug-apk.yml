name: Build NuvioTV Release APK

on:
  workflow_dispatch:

concurrency:
  group: nuvio-tv-release-build
  cancel-in-progress: true

env:
  TROY_BASE_URL: ${{ secrets.TROY_BASE_URL }}
  TROY_CINEMETA_MANIFEST_URL: ${{ secrets.TROY_CINEMETA_MANIFEST_URL }}
  DEFAULT_SUBTITLES_MANIFEST_URL: ${{ secrets.DEFAULT_SUBTITLES_MANIFEST_URL }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          echo "AVATAR_PUBLIC_BASE_URL=${{ secrets.AVATAR_PUBLIC_BASE_URL }}" >> local.properties
          echo "TV_LOGIN_WEB_BASE_URL=${{ secrets.TV_LOGIN_WEB_BASE_URL }}" >> local.properties

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Create temporary signing keystore
        run: |
          rm -f nuviotv.jks
          keytool -genkeypair \
            -v \
            -keystore nuviotv.jks \
            -storepass 815787 \
            -keypass 815787 \
            -alias nuviotv \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Nuvio Release,O=Troy,C=US"

      - name: Build full Release APK
        run: ./gradlew :app:assembleFullRelease -x lint -x test --build-cache --parallel --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-tv-full-release-apk
          path: app/build/outputs/apk/full/release/*.apk
